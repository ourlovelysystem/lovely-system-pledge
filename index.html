<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pledge</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 2rem;
      color: #f5f7f2;
      background: #08110c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 8rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to Pledge.</h1>
  </main>
</body>
</html>
