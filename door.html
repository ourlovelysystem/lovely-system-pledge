<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pledge — Step Up</title>
  <style>
    :root { color-scheme:dark; font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace; background:#080a09; color:#f2f5f3 }
    * { box-sizing:border-box } body { margin:0; min-height:100svh; display:grid; place-items:center; padding:1.25rem; background:#080a09 }
    main { width:min(48rem,100%); border:1px solid #59625c; background:#111511; box-shadow:0 24px 80px rgba(0,0,0,.45) }
    header, section { padding:clamp(1.25rem,4vw,2.5rem) } header { border-bottom:1px solid #59625c; background:#191e1a }
    h1 { margin:0; font:400 clamp(3rem,10vw,6rem)/.9 Georgia,serif; letter-spacing:-.05em } p { color:#b9c0bb; line-height:1.55 }
    .status { min-height:1.5rem; color:#d7ff2f; font-weight:800 } button { min-height:3.5rem; border:1px solid #d7ff2f; border-radius:.2rem; padding:.75rem 1.25rem; background:#d7ff2f; color:#10110d; font:800 1rem inherit; cursor:pointer } button:disabled { cursor:wait; opacity:.55 }
  </style>
</head>
<body>
  <main>
    <header><h1>Step Up.</h1><p>Listen. Answer. Pledge will keep the response long enough to hear what happened.</p></header>
    <section>
      <p id="status" class="status" role="status" aria-live="polite">Press Step Up to hear the question.</p>
      <button id="step-up" type="button">Step Up</button>
    </section>
  </main>
  <script>
    const API = "https://api.pledge.ourlovelysystem.org";
    const button = document.querySelector("#step-up");
    const status = document.querySelector("#status");
    const supported = ["audio/webm;codecs=opus", "audio/mp4;codecs=mp4a.40.2", "audio/ogg;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
    const mimeType = () => supported.find((type) => MediaRecorder.isTypeSupported(type));
    const setStatus = (text) => status.textContent = text;
    let session, recorder, stream, chunks, audioContext;

    async function api(path, options = {}) {
      const response = await fetch(`${API}${path}`, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || `Request failed (${response.status}).`);
      return body;
    }

    const tokenHeaders = (extra = {}) => ({ "x-pledge-session-token": session.browser_session_token, ...extra });

    function beep() {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      oscillator.frequency.value = 880;
      gain.gain.setValueAtTime(0.08, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.12);
      oscillator.connect(gain).connect(audioContext.destination);
      oscillator.start(); oscillator.stop(audioContext.currentTime + 0.12);
    }

    async function submit() {
      const responseBlob = new Blob(chunks, { type:recorder.mimeType });
      const contentType = responseBlob.type.split(";", 1)[0];
      setStatus("Sending your response.");
      const upload = await api(`/door-sessions/${session.session_id}/upload-url`, { method:"POST", headers:tokenHeaders({ "content-type":"application/json" }), body:JSON.stringify({ content_type:contentType }) });
      const uploaded = await fetch(upload.upload_url, { method:"PUT", headers:{ "content-type":contentType }, body:responseBlob });
      if (!uploaded.ok) throw new Error(`Audio upload failed (${uploaded.status}).`);
      await api(`/door-sessions/${session.session_id}/submit`, { method:"POST", headers:tokenHeaders() });
      sessionStorage.setItem("pledge-door-session", JSON.stringify({ session_id:session.session_id, browser_session_token:session.browser_session_token }));
      window.location.assign("./recording.html");
    }

    async function recordResponse() {
      const type = mimeType();
      if (!type) throw new Error("This browser has no supported recording format.");
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      chunks = [];
      recorder = new MediaRecorder(stream, { mimeType:type });
      recorder.addEventListener("dataavailable", (event) => { if (event.data.size) chunks.push(event.data); });
      recorder.addEventListener("stop", async () => {
        stream.getTracks().forEach((track) => track.stop());
        try { await submit(); } catch (error) { setStatus(error.message); button.disabled = false; }
      }, { once:true });
      beep();
      recorder.start();
      setStatus(`Recording your answer for ${session.recording_seconds} seconds.`);
      window.setTimeout(() => { recorder.stop(); beep(); }, session.recording_seconds * 1000);
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      try {
        audioContext = new AudioContext();
        await audioContext.resume();
        setStatus("Preparing a borrowed question.");
        session = await api("/door-sessions", { method:"POST" });
        const challenge = new Audio(session.challenge_audio_url);
        challenge.addEventListener("ended", async () => {
          try {
            await api(`/door-sessions/${session.session_id}/challenge-played`, { method:"POST", headers:tokenHeaders() });
            await recordResponse();
          } catch (error) { setStatus(error.name === "NotAllowedError" ? "Microphone permission was not granted." : error.message); button.disabled = false; }
        }, { once:true });
        setStatus("Listen.");
        await challenge.play();
      } catch (error) {
        setStatus(error.message); button.disabled = false;
      }
    });
  </script>
</body>
</html>
